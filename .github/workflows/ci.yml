name: Calculator checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: finance_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  orbit-calc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit_calc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orbit_calc/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Expo SDK transitive advisories are recorded in docs/AUDIT.md.
      - name: Report remaining Expo dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=moderate
